name: Build, test and release

# Every push and pull request: build and run the core tests, as a check. A version tag (for example
# v0.9.0-beta.3) also signs Colorbee with Leah's Developer ID, has Apple notarize it, and publishes the zip
# (Colorbee.app and "Start Here.txt") as a GitHub Release, the same shape as Honeycomb's release workflow.
# A tag with a dash (a beta) becomes a pre-release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Colorbee needs macOS 26 and Xcode 26.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test
        run: make test

      # ── Tag pushes only: package, sign, notarize, release ─────────────────────────────────────────────

      # v0.9.0-beta.3 → version 0.9.0, build 3. A tag without a number at the end uses the run number.
      - name: Version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          marketing="${tag%%-*}"
          build="${tag##*.}"
          if [[ "$tag" != *-* || ! "$build" =~ ^[0-9]+$ ]]; then build="$GITHUB_RUN_NUMBER"; fi
          if [[ "$tag" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Package, sign and notarize
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          export NOTARY_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8" > "$NOTARY_KEY_PATH"
          export NOTARY_KEY_ID="$APPLE_API_KEY_ID" NOTARY_ISSUER="$APPLE_API_ISSUER_ID"
          Scripts/make-beta.sh
          rm -f "$NOTARY_KEY_PATH"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Beta/*.zip
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            Colorbee ${{ steps.version.outputs.marketing }} (${{ steps.version.outputs.build }}): a Mac paint and editing app.
            Download the zip, open it, and read "Start Here.txt". Needs a Mac with Apple silicon and macOS 26.
            Signed with a Developer ID and notarized by Apple, so it opens without security warnings.

      - name: Remove the signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true
