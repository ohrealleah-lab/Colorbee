<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"></helmet>
<div style="height:28px;width:100%;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;font-size:11px;color:var(--ink2);background:var(--win);border-top:0.5px solid var(--sep);font-variant-numeric:tabular-nums;white-space:nowrap">
  <div style="display:flex;align-items:center;gap:5px;min-width:92px"><span style="font-family:'Material Symbols Rounded';font-size:14px;line-height:1">arrow_selector_tool</span>{{ pos }}</div>
  <div style="width:1px;height:12px;background:var(--sep)"></div>
  <div style="display:flex;align-items:center;gap:5px;min-width:100px"><svg width="13" height="13"><rect x="1.5" y="2" width="10" height="9" rx="1" style="fill:none;stroke:currentColor;stroke-width:1.2;stroke-dasharray:2 1.5"></rect></svg>{{ sel }}</div>
  <div style="width:1px;height:12px;background:var(--sep)"></div>
  <div style="display:flex;align-items:center;gap:5px;min-width:80px"><span style="font-family:'Material Symbols Rounded';font-size:15px;line-height:1">straighten</span>{{ measure }}</div>
  <div style="width:1px;height:12px;background:var(--sep)"></div>
  <div style="display:flex;align-items:center;gap:5px"><span style="font-family:'Material Symbols Rounded';font-size:14px;line-height:1">aspect_ratio</span>{{ canvas }}</div>
  <div style="flex:1"></div>
  <sc-if value="{{ pixel }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:4px;margin-right:6px">
      <div style="height:20px;padding:0 8px;border-radius:10px;display:flex;align-items:center;gap:4px;background:var(--accentSoft);color:var(--accent)"><span style="font-family:'Material Symbols Rounded';font-size:14px;line-height:1">grid_on</span>Pixel Grid</div>
      <div style="height:20px;padding:0 8px;border-radius:10px;display:flex;align-items:center;gap:4px;background:var(--accentSoft);color:var(--accent)"><span style="font-family:'Material Symbols Rounded';font-size:14px;line-height:1">flip</span>Symmetry: Vertical</div>
    </div>
    <div style="width:1px;height:12px;background:var(--sep)"></div>
  </sc-if>
  <span style="font-family:'Material Symbols Rounded';font-size:14px;line-height:1">zoom_out</span>
  <div style="position:relative;width:100px;height:14px;display:flex;align-items:center">
    <div style="position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--field);box-shadow:inset 0 0 0 0.5px var(--sep)"></div>
    <div style="position:absolute;left:0;width:{{ zoomPos }}%;height:3px;border-radius:2px;background:var(--accent)"></div>
    <div style="position:absolute;left:{{ zoomPos }}%;margin-left:-8px;width:16px;height:11px;border-radius:6px;background:#fff;box-shadow:0 0.5px 2px rgba(0,0,0,.4)"></div>
  </div>
  <span style="font-family:'Material Symbols Rounded';font-size:14px;line-height:1">zoom_in</span>
  <span style="color:var(--ink);min-width:38px;text-align:right">{{ zoom }}</span>
  <div style="height:18px;padding:0 8px;border-radius:9px;background:var(--field);color:var(--ink);display:flex;align-items:center">100%</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1512,&quot;height&quot;:28},&quot;pos&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;—&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;—&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;measure&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;—&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;canvas&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1920 × 1080 px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;zoom&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;zoomPos&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;default&quot;:50,&quot;tsType&quot;:&quot;number&quot;},&quot;pixel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      pos: p.pos ?? '—', sel: p.sel ?? '—', measure: p.measure ?? '—', canvas: p.canvas ?? '1920 × 1080 px',
      zoom: p.zoom ?? '100%', zoomPos: p.zoomPos ?? 50, pixel: !!p.pixel
    };
  }
}
</script>
</body>
</html>
