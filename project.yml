name: Colorbee
options:
  bundleIdPrefix: com.leah
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ColorbeeCore:
    path: Packages/ColorbeeCore

targets:
  Colorbee:
    type: application
    platform: macOS
    sources:
      - Sources/Colorbee
    dependencies:
      - package: ColorbeeCore
    info:
      path: Sources/Colorbee/Info.plist
      properties:
        CFBundleDisplayName: Colorbee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: Colorbee beta, for testing only.
        NSPrincipalClass: NSApplication
        NSServices:
          - NSMenuItem:
              default: Open in Colorbee
            NSMessage: openInColorbee
            NSPortName: Colorbee
            NSRequiredContext: {}
            NSSendFileTypes: [public.image, com.adobe.pdf, com.leah.colorbee.colorproj]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.leah.colorbee.colorpalette
            UTTypeDescription: Colorbee Palette
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [colorpalette]
          - UTTypeIdentifier: com.leah.colorbee.colorbeefilter
            UTTypeDescription: Colorbee Photo Filter
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [colorbeefilter]
          - UTTypeIdentifier: com.leah.colorbee.colorbeekeys
            UTTypeDescription: Colorbee Keyboard Shortcuts
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [colorbeekeys]
          - UTTypeIdentifier: com.leah.colorbee.colorproj
            UTTypeDescription: Colorbee Project
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [colorproj]
        CFBundleDocumentTypes:
          - CFBundleTypeName: PNG image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ImageDocument
          - CFBundleTypeName: Colorbee Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.leah.colorbee.colorproj]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ImageDocument
          - CFBundleTypeName: JPEG image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ImageDocument
          - CFBundleTypeName: HEIC image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.heic]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ImageDocument
          - CFBundleTypeName: TIFF image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.tiff]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ImageDocument
          - CFBundleTypeName: GIF image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.compuserve.gif]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ImageDocument
          - CFBundleTypeName: BMP image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.microsoft.bmp]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ImageDocument
          - CFBundleTypeName: WebP image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.webmproject.webp]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ImageDocument
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ImageDocument
          - CFBundleTypeName: Camera RAW photo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.camera-raw-image]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ImageDocument
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leah.Colorbee
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.9.0
        CURRENT_PROJECT_VERSION: 1

schemes:
  Colorbee:
    build:
      targets:
        Colorbee: all
    run:
      config: Debug
